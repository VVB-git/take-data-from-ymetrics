<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Тип: статистика по возрасту</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../styles.css">
</head>
<body>
  <div class="deck">
    <section class="slide">
      <div class="slide-inner">
        <h1 class="stats-title"><span class="accent">статистика</span> по возрасту пользователей</h1>
        <div class="stats-grid" id="age-stats"></div>
        <div class="stats-grid gender-stats">
          <div class="stat-block male">
            <div class="pill-head">мужчины</div>
            <div class="pill"><span class="lab">Отказы:</span> <span data-bind="genderBehavior.male.bounceRate" data-fmt="bounce"></span></div>
            <div class="pill"><span class="lab">Глубина просмотра:</span> <span data-bind="genderBehavior.male.pageDepth" data-fmt="depth"></span></div>
            <div class="pill"><span class="lab">Время на сайте:</span> <span data-bind="genderBehavior.male.avgDuration"></span></div>
          </div>
          <div class="stat-block female">
            <div class="pill-head">женщины</div>
            <div class="pill"><span class="lab">Отказы:</span> <span data-bind="genderBehavior.female.bounceRate" data-fmt="bounce"></span></div>
            <div class="pill"><span class="lab">Глубина просмотра:</span> <span data-bind="genderBehavior.female.pageDepth" data-fmt="depth"></span></div>
            <div class="pill"><span class="lab">Время на сайте:</span> <span data-bind="genderBehavior.female.avgDuration"></span></div>
          </div>
        </div>
      </div>
      <div class="footer">
        <span data-bind="meta.brand"></span>
        <span class="sep"></span>
        <span>Поведенческие факторы</span>
      </div>
    </section>
  </div>
  <script src="../data.js"></script>
  <script src="../render.js"></script>
</body>
</html>
